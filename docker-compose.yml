version: '3.8'

services:
  hardhat-node:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"
    networks:
      - web3-network

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "3000:80"
    depends_on:
      - hardhat-node
    networks:
      - web3-network

networks:
  web3-network:
    driver: bridge
