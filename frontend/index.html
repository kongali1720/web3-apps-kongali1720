<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web3 · kongali1720</title>
  <!-- Font & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b0e1a 0%, #141a2b 100%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: #eef2fb;
    }

    .container {
      max-width: 760px;
      width: 100%;
      background: rgba(22, 28, 46, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 1.8rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(120, 160, 255, 0.08);
      transition: all 0.2s ease;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #b7cbff, #7aa3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand h1 i {
      font-size: 1.8rem;
      color: #7aa3ff;
      background: transparent;
    }

    .brand .sub {
      font-size: 0.85rem;
      color: #8b9acb;
      margin-top: 0.1rem;
      letter-spacing: 0.3px;
    }

    .brand .sub a {
      color: #9bb2ff;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dashed #3d4b78;
    }

    .brand .sub a:hover {
      color: #c2d4ff;
      border-bottom-color: #7aa3ff;
    }

    .wallet-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .wallet-info {
      background: #1d253f;
      padding: 0.45rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 450;
      border: 1px solid #2e3a60;
      color: #b6c8f0;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.4);
    }

    .btn {
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-weight: 550;
      font-size: 0.85rem;
      background: #28345a;
      color: #d6e2ff;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid #3b4a78;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .btn i {
      font-size: 0.9rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4a6cf7, #6b4cff);
      border: 1px solid #7a94ff;
      color: white;
      box-shadow: 0 4px 14px rgba(74, 108, 247, 0.25);
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(74, 108, 247, 0.4);
      background: linear-gradient(135deg, #5a7cff, #7b5eff);
    }

    .btn-success {
      background: #1f8b4c;
      border-color: #2daf62;
      color: white;
    }
    .btn-success:hover {
      background: #28a75b;
      border-color: #3bcb76;
    }

    .btn-info {
      background: #25648a;
      border-color: #3886b3;
      color: white;
    }
    .btn-info:hover {
      background: #2f7aa8;
    }

    .btn-danger {
      background: #96314a;
      border-color: #c04462;
      color: white;
    }
    .btn-danger:hover {
      background: #b33d59;
    }

    .btn:disabled {
      opacity: 0.4;
      filter: grayscale(0.5);
      pointer-events: none;
    }

    .card {
      background: #131b30cc;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 1.8rem;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.8rem;
      border: 1px solid #2a3760;
      box-shadow: 0 8px 18px -6px #03050b;
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #b8ccff;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card h2 i {
      color: #6d8cff;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #26305a;
      font-size: 0.9rem;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row span:first-child {
      color: #98abdf;
    }

    .info-row code {
      background: #0d1326;
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      font-size: 0.8rem;
      color: #bed3ff;
      border: 1px solid #31416e;
    }

    .status {
      background: #1f294a;
      padding: 0.1rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
    }

    .value-display {
      background: #0b1123;
      border-radius: 1.8rem;
      padding: 0.8rem 1.5rem;
      margin: 0.8rem 0 1.4rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #314376;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
    }

    .value-display h3 {
      font-weight: 400;
      color: #a3b9f0;
      font-size: 0.95rem;
    }

    .value {
      font-size: 1.8rem;
      font-weight: 600;
      color: #d6e6ff;
      background: #1b2547;
      padding: 0.1rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #4a60a0;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      gap: 0.7rem;
      margin: 0.8rem 0 1.2rem 0;
      flex-wrap: wrap;
    }

    .input-group input {
      flex: 2;
      min-width: 140px;
      background: #0d142b;
      border: 1px solid #38467a;
      border-radius: 60px;
      padding: 0.7rem 1.3rem;
      color: #ecf3ff;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #6b8aff;
      box-shadow: 0 0 0 3px #3650aa50;
    }

    .input-group input::placeholder {
      color: #586c9f;
      font-weight: 300;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 0.2rem;
    }

    .button-group .btn {
      flex: 1;
      justify-content: center;
      min-width: 90px;
    }

    .activity-log {
      background: #0b1123cc;
      border-radius: 1.4rem;
      padding: 0.8rem 1.2rem;
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #2a376a;
      font-size: 0.9rem;
      color: #bac8f5;
    }

    .activity-log p {
      color: #6677ae;
      font-style: italic;
    }

    .activity-log .log-entry {
      padding: 0.3rem 0;
      border-bottom: 1px dashed #29345a;
      display: flex;
      gap: 0.6rem;
    }

    .activity-log .log-entry i {
      color: #6f8cff;
      width: 1.2rem;
    }

    .activity-log .log-entry:last-child {
      border-bottom: none;
    }

    footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.75rem;
      color: #5d6f9f;
      letter-spacing: 0.4px;
      border-top: 1px solid #26305a;
      padding-top: 1.5rem;
    }

    footer i {
      color: #d66b8b;
    }

    .activity-log::-webkit-scrollbar {
      width: 4px;
    }
    .activity-log::-webkit-scrollbar-track {
      background: #131e3a;
      border-radius: 10px;
    }
    .activity-log::-webkit-scrollbar-thumb {
      background: #4a62a0;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .container { padding: 1.5rem; }
      .brand h1 { font-size: 1.5rem; }
      .wallet-area { margin-top: 0.6rem; width: 100%; }
      .btn { font-size: 0.75rem; padding: 0.4rem 1rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1><i class="fas fa-cube"></i> Web3 Vault</h1>
      <div class="sub">by <a href="https://github.com/kongali1720" target="_blank"><i class="fab fa-github"></i> @kongali1720</a></div>
    </div>
    <div class="wallet-area">
      <div id="walletAddress" class="wallet-info"><i class="fas fa-circle" style="color:#4a7aff; font-size: 0.5rem; margin-right: 6px;"></i> Not connected</div>
      <button id="connectBtn" class="btn btn-primary"><i class="fas fa-plug"></i> Connect</button>
    </div>
  </header>

  <main>
    <!-- Contract info -->
    <div class="card">
      <h2><i class="fas fa-file-contract"></i> Contract</h2>
      <div class="info-row">
        <span><i class="fas fa-map-pin"></i> Address</span>
        <code id="contractAddress">0xE7...3F9a</code>
      </div>
      <div class="info-row">
        <span><i class="fas fa-network-wired"></i> Network</span>
        <span id="network"><i class="fas fa-check-circle" style="color:#3ccf7e; margin-right: 4px;"></i> Sepolia</span>
      </div>
      <div class="info-row">
        <span><i class="fas fa-user-shield"></i> Owner status</span>
        <span id="isOwner" class="status"><i class="fas fa-spinner fa-pulse"></i> loading</span>
      </div>
    </div>

    <!-- Interaction -->
    <div class="card">
      <h2><i class="fas fa-arrows-spin"></i> Storage</h2>
      <div class="value-display">
        <h3><i class="fas fa-database"></i> Stored value</h3>
        <div id="storedValue" class="value">—</div>
      </div>

      <div class="input-group">
        <input type="number" id="inputValue" placeholder="Enter number" step="1">
        <button id="setBtn" class="btn btn-success"><i class="fas fa-pen"></i> Set</button>
      </div>

      <div class="button-group">
        <button id="getBtn" class="btn btn-info"><i class="fas fa-rotate-right"></i> Get</button>
        <button id="resetBtn" class="btn btn-danger"><i class="fas fa-undo-alt"></i> Reset</button>
      </div>
    </div>

    <!-- Activity -->
    <div class="card">
      <h2><i class="fas fa-clock-rotate-left"></i> Activity</h2>
      <div id="activityLog" class="activity-log">
        <p><i class="fas fa-info-circle"></i> No activity yet</p>
      </div>
    </div>
  </main>

  <footer>
    <i class="fas fa-heart"></i> built with ethers · 2026
  </footer>
</div>

<!-- Ethers -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.8.0/dist/ethers.umd.min.js"></script>
<script>
  (function() {
    // ----- CONFIG -----
    // GANTI CONTRACT_ADDRESS dengan alamat setelah deploy!
    const CONTRACT_ADDRESS = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
    const ABI = [
      "function get() public view returns (uint256)",
      "function set(uint256 _value) public",
      "function reset() public",
      "function owner() public view returns (address)"
    ];

    // DOM refs
    const walletSpan = document.getElementById('walletAddress');
    const connectBtn = document.getElementById('connectBtn');
    const contractAddressSpan = document.getElementById('contractAddress');
    const networkSpan = document.getElementById('network');
    const isOwnerSpan = document.getElementById('isOwner');
    const storedValueDiv = document.getElementById('storedValue');
    const inputValue = document.getElementById('inputValue');
    const setBtn = document.getElementById('setBtn');
    const getBtn = document.getElementById('getBtn');
    const resetBtn = document.getElementById('resetBtn');
    const activityLog = document.getElementById('activityLog');

    // state
    let signer = null;
    let contract = null;
    let currentAccount = null;
    let provider = null;

    // helper: log activity
    function addActivity(message, icon = 'fa-circle-check') {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
      activityLog.prepend(entry);
      while (activityLog.children.length > 8) {
        activityLog.removeChild(activityLog.lastChild);
      }
    }

    // update UI with stored value
    async function updateStoredValue() {
      if (!contract) {
        storedValueDiv.textContent = '⛓️';
        return;
      }
      try {
        const val = await contract.get();
        storedValueDiv.textContent = val.toString();
      } catch (e) {
        storedValueDiv.textContent = '⚠️';
        console.warn('get() error', e);
      }
    }

    // check owner status
    async function updateOwnerStatus(account) {
      if (!contract || !account) {
        isOwnerSpan.innerHTML = '<i class="fas fa-circle" style="color:#7a7f9f;"></i> unknown';
        return;
      }
      try {
        const owner = await contract.owner();
        const isOwner = owner.toLowerCase() === account.toLowerCase();
        isOwnerSpan.innerHTML = isOwner
          ? '<i class="fas fa-check-circle" style="color:#4cdb7b;"></i> owner'
          : '<i class="fas fa-user" style="color:#aab9f0;"></i> user';
      } catch (e) {
        isOwnerSpan.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#e68a5f;"></i> error';
      }
    }

    // connect wallet
    async function connectWallet() {
      if (typeof window.ethereum === 'undefined') {
        alert('🦊 MetaMask not detected! Please install it.');
        return;
      }

      try {
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        currentAccount = await signer.getAddress();

        walletSpan.innerHTML = `<i class="fas fa-circle" style="color:#4cdb7b; font-size:0.5rem; margin-right:6px;"></i> ${currentAccount.slice(0,6)}...${currentAccount.slice(-4)}`;
        connectBtn.innerHTML = '<i class="fas fa-link"></i> Connected';

        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
        contractAddressSpan.textContent = CONTRACT_ADDRESS.slice(0,8)+'...'+CONTRACT_ADDRESS.slice(-6);

        const network = await provider.getNetwork();
        const chainId = network.chainId;
        let netName = 'Sepolia';
        if (chainId === 1n) netName = 'Ethereum';
        else if (chainId === 11155111n) netName = 'Sepolia';
        else if (chainId === 5n) netName = 'Goerli';
        else if (chainId === 1337n || chainId === 31337n) netName = 'Localhost';
        else netName = `chain ${chainId}`;
        networkSpan.innerHTML = `<i class="fas fa-check-circle" style="color:#3ccf7e; margin-right:4px;"></i> ${netName}`;

        await updateOwnerStatus(currentAccount);
        await updateStoredValue();
        addActivity(`Connected · ${currentAccount.slice(0,6)}...${currentAccount.slice(-4)}`, 'fa-plug');
      } catch (err) {
        console.error(err);
        alert('Connection failed: ' + err.message);
      }
    }

    // set value
    async function setValue() {
      if (!contract || !signer) {
        alert('Connect wallet first!');
        return;
      }
      const val = parseInt(inputValue.value);
      if (isNaN(val)) {
        alert('Please enter a valid number.');
        return;
      }
      try {
        setBtn.disabled = true;
        setBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> sending';
        const tx = await contract.set(val);
        addActivity(`⏳ Set ${val} · tx ${tx.hash.slice(0,8)}...`, 'fa-hourglass-half');
        await tx.wait();
        addActivity(`✅ Set ${val} confirmed`, 'fa-check-circle');
        await updateStoredValue();
        inputValue.value = '';
      } catch (e) {
        console.error(e);
        addActivity(`❌ Set failed: ${e.message.slice(0,50)}`, 'fa-circle-xmark');
      } finally {
        setBtn.disabled = false;
        setBtn.innerHTML = '<i class="fas fa-pen"></i> Set';
      }
    }

    // get value (refresh)
    async function getValue() {
      if (!contract) {
        alert('Connect wallet first.');
        return;
      }
      try {
        await updateStoredValue();
        addActivity('🔄 Fetched value', 'fa-rotate-right');
      } catch (e) {
        addActivity('⚠️ Could not fetch', 'fa-triangle-exclamation');
      }
    }

    // reset contract
    async function resetContract() {
      if (!contract || !signer) {
        alert('Connect wallet first.');
        return;
      }
      try {
        resetBtn.disabled = true;
        resetBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
        const tx = await contract.reset();
        addActivity(`⏳ Reset · tx ${tx.hash.slice(0,8)}...`, 'fa-hourglass-half');
        await tx.wait();
        addActivity('🔄 Reset confirmed', 'fa-rotate-left');
        await updateStoredValue();
      } catch (e) {
        console.error(e);
        addActivity(`❌ Reset failed: ${e.message.slice(0,50)}`, 'fa-circle-xmark');
      } finally {
        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="fas fa-undo-alt"></i> Reset';
      }
    }

    // event listeners
    connectBtn.addEventListener('click', connectWallet);
    setBtn.addEventListener('click', setValue);
    getBtn.addEventListener('click', getValue);
    resetBtn.addEventListener('click', resetContract);

    // auto connect if already authorized
    window.addEventListener('load', async () => {
      if (typeof window.ethereum !== 'undefined') {
        try {
          provider = new ethers.BrowserProvider(window.ethereum);
          const accounts = await provider.listAccounts();
          if (accounts.length > 0) {
            await connectWallet();
          } else {
            contractAddressSpan.textContent = CONTRACT_ADDRESS.slice(0,8)+'...'+CONTRACT_ADDRESS.slice(-6);
          }
        } catch (e) { /* silent */ }
      } else {
        contractAddressSpan.textContent = '🦊 install MetaMask';
      }
    });

    // listen for account/chain changes
    if (window.ethereum) {
      window.ethereum.on('accountsChanged', (accounts) => {
        if (accounts.length === 0) {
          currentAccount = null;
          signer = null;
          contract = null;
          walletSpan.innerHTML = '<i class="fas fa-circle" style="color:#4a7aff; font-size:0.5rem; margin-right:6px;"></i> Not connected';
          connectBtn.innerHTML = '<i class="fas fa-plug"></i> Connect';
          storedValueDiv.textContent = '—';
          isOwnerSpan.innerHTML = '<i class="fas fa-circle" style="color:#7a7f9f;"></i> unknown';
          addActivity('🔌 Wallet disconnected', 'fa-power-off');
        } else {
          connectWallet();
        }
      });

      window.ethereum.on('chainChanged', () => {
        window.location.reload();
      });
    }

    contractAddressSpan.textContent = CONTRACT_ADDRESS.slice(0,8)+'...'+CONTRACT_ADDRESS.slice(-6);
  })();
</script>
</body>
</html>
